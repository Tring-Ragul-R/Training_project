<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/SignIn.css" />
    <!-- open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <!-- Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="container">
        <img
          style="margin-left: 80px"
          src="/Assests/tringapps-copy-2.png"
          width="150px"
          height="32.85px"
        />
        <div class="signin-container">
          <div class="signin">
            <div style="display: flex; justify-content: center">
              <p
                class="button"
                style="background-color: #eba832; color: #fefefe"
              >
                Sign In
              </p>
              <a href="/Signup.html"
                ><p
                  class="button"
                  style="
                    color: #888888;
                    background-color: #333333;
                    cursor: pointer;
                  "
                >
                  Sign Up
                </p></a
              >
            </div>

            <div style="margin-top: 25px">
              <p class="input-label">Your Email</p>
              <input id="signin-email" type="email" placeholder="Enter email" />
            </div>

            <div style="margin-top: 30px">
              <p class="input-label">Your Password</p>
              <input
                id="signin-password"
                type="password"
                placeholder="Enter password"
              />
            </div>

            <div
              class="remember"
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 12px;
              "
            >
              <div style="display: flex; align-items: center; gap: 2px">
                <input type="checkbox" />
                <p>Remember me</p>
              </div>
              <div>
                <a style="text-decoration: underline; cursor: pointer"
                  >Forget password</a
                >
              </div>
            </div>

            <button
              id="signin-button"
              class="button-icon"
              style="margin-top: 30px; background-color: #eba832"
            >
              Submit
            </button>

            <p
              style="
                text-align: center;
                margin-top: 24px;
                margin-bottom: 24px;
                font-weight: 400;
                font-size: 12px;
                font-family: sans-serif;
                color: white;
              "
            >
              OR
            </p>

            <button class="button-icon google-btn">
              Sign up with <img src="/Assests/ic_google.png" />
            </button>

            <p
              style="
                margin-top: 32px;
                color: white;
                font-family: sans-serif;
                font-size: 14px;
                font-weight: 400;
                text-align: center;
              "
            >
              Don't have an account?
              <a href="index.html"
                ><span style="color: #eba832"> sign up</span></a
              >
            </p>
          </div>
        </div>
      </div>

      <div class="dummy">
        <img src="/Assests/image (6).png" />
      </div>
    </div>

    <script src="/js/signin.js"></script>
  </body>
</html>
